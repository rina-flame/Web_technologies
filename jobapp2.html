<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Application</title>
<style>
body {
  font-family: Georgia, serif;
  background: #fdf8ef;
  padding: 30px;
  color: #3a352e;
}
form {
  max-width: 600px;
  margin: auto;
  background: #fffdf9;
  padding: 28px;
  border-radius: 12px;
  border: 1px solid #e9e1d1;
}
h2 { text-align: center; font-weight: normal; letter-spacing: 1px; }
fieldset {
  border: 1px solid #e9e1d1;
  border-radius: 8px;
  margin-bottom: 18px;
  padding: 16px;
  background: #fffefb;
}
legend {
  padding: 4px 10px;
  background: #f5efe3;
  border-radius: 20px;
  font-size: 14px;
}
label { display: block; margin-top: 12px; font-size: 14px; }
input, select, textarea {
  width: 100%;
  padding: 9px;
  margin-top: 5px;
  border: 1px solid #ddd6c6;
  border-radius: 6px;
  background: #fff;
}
button {
  width: 100%;
  padding: 12px;
  background: #3a352e;
  color: #fdf8ef;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 10px;
}
meter, progress { width: 100%; }
.small { font-size: 12px; color: #8a8378; }
</style>
</head>
<body>

<h2>Job Application</h2>

<form action="/apply" method="POST" enctype="multipart/form-data" id="jobForm">

<fieldset>
<legend>Personal Info</legend>

<label for="fullname">Full Name *</label>
<input type="text" id="fullname" name="fullname" required minlength="2" maxlength="50">

<label for="email">Email *</label>
<input type="email" id="email" name="email" required>

<label for="phone">Phone *</label>
<input type="tel" id="phone" name="phone" required pattern="\+92-3[0-9]{2}-[0-9]{7}">

<label for="cnic">CNIC *</label>
<input type="text" id="cnic" name="cnic" required pattern="[0-9]{5}-[0-9]{7}-[0-9]{1}">
</fieldset>

<fieldset>
<legend>Position Details</legend>

<label for="position">Position *</label>
<select id="position" name="position" required>
<optgroup label="IT">
<option>Software Developer</option>
<option>Web Developer</option>
</optgroup>
<optgroup label="Admin">
<option>HR Officer</option>
<option>Accountant</option>
</optgroup>
</select>

<label for="startdate">Start Date *</label>
<input type="date" id="startdate" name="startdate" required>

<label for="salary">Expected Salary</label>
<input type="number" id="salary" name="salary" min="30000" max="200000" step="5000">
</fieldset>

<fieldset>
<legend>Experience</legend>

<label for="years">Years of Experience</label>
<input type="number" id="years" name="years" min="0" max="50">

<label for="employer">Current Employer</label>
<input type="text" id="employer" name="employer" maxlength="100">

<label for="summary">Summary</label>
<textarea id="summary" name="summary" maxlength="500" rows="4"></textarea>
<p class="small">Count: <output id="count">0</output> of 500</p>
</fieldset>

<fieldset>
<legend>Skills</legend>

<label for="skill">Primary Skill</label>
<input list="skills" id="skill" name="skill">
<datalist id="skills">
<option value="HTML">
<option value="CSS">
<option value="JavaScript">
<option value="Python">
</datalist>

<label>Additional Skills</label>
<input type="checkbox" id="s1" name="addskill" value="Teamwork"> <label for="s1" style="display:inline;">Teamwork</label><br>
<input type="checkbox" id="s2" name="addskill" value="Communication"> <label for="s2" style="display:inline;">Communication</label><br>
<input type="checkbox" id="s3" name="addskill" value="Problem Solving"> <label for="s3" style="display:inline;">Problem Solving</label>

<label for="level">Skill Level</label>
<input type="range" id="level" name="level" min="0" max="100" value="50">
</fieldset>

<fieldset>
<legend>Documents</legend>

<label for="resume">Resume *</label>
<input type="file" id="resume" name="resume" required accept=".pdf,.doc,.docx">

<label for="photo">Photo *</label>
<input type="file" id="photo" name="photo" required accept="image/*">
</fieldset>

<fieldset>
<legend>Security</legend>

<label for="password">Password *</label>
<input type="password" id="password" name="password" required minlength="8">

<label>Strength</label>
<meter id="strength" min="0" max="4" value="0"></meter>
<p class="small" id="strengthText"></p>
</fieldset>

<p class="small">Completion: <progress id="progress" value="0" max="100"></progress> <span id="progressText">0%</span></p>

<button type="submit">Submit Application</button>

</form>

<script>
document.getElementById('startdate').min = new Date().toISOString().split('T')[0];

const summary = document.getElementById('summary');
const count = document.getElementById('count');
summary.addEventListener('input', () => {
  count.value = summary.value.length;
});

const pass = document.getElementById('password');
const meter = document.getElementById('strength');
const strengthText = document.getElementById('strengthText');
pass.addEventListener('input', () => {
  let val = pass.value;
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  meter.value = score;
  if (score <= 1) strengthText.textContent = "Weak";
  else if (score == 2) strengthText.textContent = "Medium";
  else if (score == 3) strengthText.textContent = "Strong";
  else strengthText.textContent = "Very Strong";
});

const form = document.getElementById('jobForm');
const progress = document.getElementById('progress');
const progressText = document.getElementById('progressText');
const requiredFields = form.querySelectorAll('[required]');
function updateProgress() {
  let filled = 0;
  requiredFields.forEach(f => { if (f.value.trim()!== "") filled++; });
  let percent = Math.round((filled / requiredFields.length) * 100);
  progress.value = percent;
  progressText.textContent = percent + "%";
}
form.addEventListener('input', updateProgress);
</script>

</body>
</html>
